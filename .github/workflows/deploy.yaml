name: Deploy to Ubuntu Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    defaults:
      run:
        working-directory: /home/muhazis/node-projects/homeserver-monitoring

    steps:
      - name: Pull Latest Code
        run: |
          pwd 
          git fetch origin main
          git reset --hard origin/main
          git clean -fd

      - name: Install Dependencies
        run: npm install

      - name: Set Dynamic App Version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          MAJOR_MINOR=$(echo $PKG_VERSION | cut -d. -f1,2)
          echo "NEXT_PUBLIC_APP_VERSION=$MAJOR_MINOR.${{ github.run_number }}" >> $GITHUB_ENV

      - name: Build Next.js App
        run: npm run build

      - name: Restart PM2 Service
        run: pm2 restart server-dashboard
